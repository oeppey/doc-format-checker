[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-checker"
version = "0.1.0"
description = "DOCX format and typo checking prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
detector = ["torch>=2", "transformers>=4.40"]
gateway = ["agent-gw>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
document-checker = "document_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_checker = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
