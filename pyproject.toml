[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-checker"
version = "0.1.0"
description = "DOCX format and typo checking prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-docx>=1.1,<2", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1", "PyMuPDF>=1.27,<2"]

[project.optional-dependencies]
detector = ["torch>=2,<3", "transformers>=4.40,<5"]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[project.scripts]
document-checker = "document_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_checker = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
