# 通用规则（源自《常用公文格式》"其他注意事项"及 GB/T 9704-2012）
# 被各文书类型规则集继承，类型内同名规则可覆盖 params。
meta:
  id: common
  name: 通用注意事项
  version: "0.1"

rules:
  - id: page-number
    name: 页码格式
    severity: error
    checker: page_number
    params:
      dash: "—"            # 一字线
      alignment: center    # 左右居中
      fonts: [宋体, SimSun]
      size_pt: 14          # 四号
      footer_distance_cm: 1.75
      tolerance_cm: 0.1

  # 国标原文转载（中国矿业大学党政办）：https://dzb.cumtb.edu.cn/info/1040/1184.htm
  # Q1 依据：GB/T 9704-2012 7.3.3 的结构层次序数为“一、”“（一）”“1.”“（1）”。
  # 假设：10 号样本的“1、”承担结构标题序数；暂按 error 报疑似层级错误。
  # 待确认：业务判定该段的真实角色、适用文书范围及 error/warning 级别；国标未禁止所有正文“1、”列举。
  - id: heading-number
    name: 标题序号
    severity: error
    checker: heading_number
    params: {}             # 一级"一、" 二级"（一）" 三级"1." 四级"（1）"，三级四级右侧不空格

  - id: attachment-format
    name: 附件说明格式
    severity: error
    checker: attachment
    params:
      indent_chars: 2          # 左空两字
      blank_lines_before: 1    # 正文下空一行
      forbid_trailing_punct: true

  # Q3 依据：GB/T 9704-2012 7.3.5.4 要求阿拉伯数字标全年月日，月日不编虚位。
  # 假设：本项目的成文日期按 YYYY年M月D日 严格校验，日期错误维持 error。
  # 待确认：业务内部是否对日期写法另有放宽及适用文书范围。
  # Q4 依据：内部《常用公文格式》落款照片要求署名前“下空二行”。
  # 假设：以署名前两个空 Word 段、各段固定行距等于正文行距为代理；具体磅值由文书类型覆盖。
  # 待确认：业务是否认可空段代理及不同盖章情形；GB/T 9704-2012 7.3.5.2 对不盖章单一机关公文写“下空一行”。
  - id: signature-layout
    name: 落款与成文日期
    severity: error
    checker: signature
    params:
      date_format: chinese     # 2026年9月18日；不接受 2026年09月18日
      blank_lines_before: 2    # 署名前两个空 Word 段；只用于内部规则的暂定代理
      seal_expected: false     # 是否要求盖章（印章位置检查需 VLM，接口预留）
